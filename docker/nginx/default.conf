# =============================================================================
#  Nginx Configuration — Production-Ready
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    charset utf-8;

    # --- Security Headers (supplementary to PHP-level headers) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # --- Deny access to hidden files (dotfiles) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- Deny access to sensitive directories ---
    location ~ ^/(vendor|src|bin|logs|storage|docker|tests)/ {
        deny all;
        return 404;
    }

    # --- Deny access to sensitive files ---
    location ~ \.(env|json|lock|md|yml|yaml|xml|ini|log|sql|sh)$ {
        deny all;
        return 404;
    }

    # --- Block PHP execution in storage/uploads ---
    location ~ ^/storage/.*\.php$ {
        deny all;
        return 404;
    }

    # --- Static assets with long cache ---
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- PHP-FPM handler ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Security: prevent path info injection.
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Performance tuning.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # --- Gzip compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Logging ---
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
